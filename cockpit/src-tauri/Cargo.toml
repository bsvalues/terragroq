[package]
name = "williamos-cockpit"
version = "0.1.6"
description = "Thin authenticated desktop cockpit for WilliamOS"
authors = ["WilliamOS"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=3.0.0", features = ["alloc", "pkcs8", "rand_core"] }
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
rand = { version = "=0.10.0", default-features = false, features = ["sys_rng"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.3"
time = { version = "=0.3.47", features = ["parsing"] }
url = "=2.5.8"
zeroize = "=1.8.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
