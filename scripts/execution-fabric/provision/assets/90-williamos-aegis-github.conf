Host ssh.github.com
    HostName ssh.github.com
    Port 443
    BatchMode yes
    StrictHostKeyChecking yes
    GlobalKnownHostsFile /etc/williamos-fabric/github_known_hosts
    UserKnownHostsFile /dev/null
    IdentityFile /etc/williamos-fabric/github-account.key
    IdentitiesOnly yes
    ProxyCommand /usr/bin/node /usr/local/libexec/williamos-aegis-remote-dev-proxy-connect.mjs %h %p
