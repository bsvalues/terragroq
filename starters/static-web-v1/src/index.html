<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task Board</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <p class="eyebrow">A little room to think</p>
    <h1>Your next small step.</h1>
    <p>Add a task, mark it complete, and make space for what comes next.</p>
    <form id="task-form"><label for="task-input">What would you like to do?</label><div class="entry"><input id="task-input" maxlength="200" placeholder="Write the first paragraph" autocomplete="off"><button type="submit">Add task</button></div></form>
    <p id="task-count" aria-live="polite">0 of 0 complete</p>
    <ul id="task-list" aria-label="Tasks"></ul>
    <footer>This board lasts for this visit. Make it your own by editing its files.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
