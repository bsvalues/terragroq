# terragroq / WilliamOS — deterministic test suite.
#
# First CI in this repository (bootstrapped 2026-08-16). Scope is deliberately
# minimal: install, then run the vitest suite under vitest.ci.config.ts, which
# excludes ONLY host-dependent files and known, WO-tracked drift (each entry
# carries its reason). Anything else failing here is a real regression.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-recovery-postgres:
    name: deterministic recovery (PostgreSQL production path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hermes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Exercise exact production recovery SQL
        run: pnpm exec vitest run tests/hermes-deterministic-validator-queue-recovery-postgres.test.ts
        env:
          CI: "true"
          HERMES_PROJECT_EXECUTION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hermes_test

  test:
    name: vitest (deterministic suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # several fabric tests resolve reviewed generations from git history

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (rfc8785 etc. used by fabric tests)
        run: python -m pip install -r requirements.txt

      - name: Run vitest (CI profile)
        run: pnpm exec vitest run --config vitest.ci.config.ts --reporter=default --reporter=junit --outputFile=vitest-junit.xml
        env:
          CI: "true"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: vitest-junit.xml
          if-no-files-found: ignore

  build:
    # The gate this repository was missing (added 2026-08-21): main compiled green in vitest while
    # `next build` was failing on a type error, because nothing ran the production build. A deploy
    # then shipped a stale standalone that passed as fresh. This job type-checks and compiles the real
    # artifact, so a non-building main can never be green again.
    name: production build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the standalone artifact
        run: pnpm run build
        env:
          CI: "true"

      - name: Prove the standalone artifact exists
        run: test -f .next/standalone/server.js || (echo "next build did not emit a standalone server" && exit 1)
