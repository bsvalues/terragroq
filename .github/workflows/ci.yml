# terragroq / WilliamOS — deterministic test suite.
#
# First CI in this repository (bootstrapped 2026-08-16). Scope is deliberately
# minimal: install, then run the vitest suite under vitest.ci.config.ts, which
# excludes ONLY host-dependent files and known, WO-tracked drift (each entry
# carries its reason). Anything else failing here is a real regression.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  work-context:
    name: work context receipt (#831)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reviewer-side half of the pre-execution gate. The route gate refuses unproven mutations made
    # through the application; a lane committing straight to a branch never touches it, which is how
    # most work actually arrives. Acceptance criterion 8 of #831: reject a pull request carrying no
    # valid receipt even when the tests are green.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the receipt's anchor is a commit on main, which a shallow clone lacks

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify the declared work-context receipt
        run: node --no-warnings scripts/verify-pr-work-context.mjs

  test:
    name: vitest (deterministic suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # several fabric tests resolve reviewed generations from git history

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (rfc8785 etc. used by fabric tests)
        run: python -m pip install -r requirements.txt

      - name: Run vitest (CI profile)
        run: pnpm exec vitest run --config vitest.ci.config.ts --reporter=default --reporter=junit --outputFile=vitest-junit.xml
        env:
          CI: "true"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: vitest-junit.xml
          if-no-files-found: ignore
