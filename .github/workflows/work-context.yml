# GitHub observes and seals delivery; WilliamOS owns authority and assignments.
name: WilliamOS delivery

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: williamos-delivery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  delivery-seal:
    name: WilliamOS assignment delivery seal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public verification material only. WilliamOS holds the private signing key server-side.
      WILLIAMOS_DELIVERY_SEAL_PUBLIC_KEYS_JSON: ${{ vars.WILLIAMOS_DELIVERY_SEAL_PUBLIC_KEYS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify WilliamOS-issued assignment delivery seals
        run: node --no-warnings scripts/verify-pr-work-context.mjs
