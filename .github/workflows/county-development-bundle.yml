name: county-development-bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/county-development-bundle.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "cockpit/**"
      - "deploy/county-development/**"
      - "drizzle/**"
      - "scripts/accept-county-development-runtime.cjs"
      - "scripts/build-county-development-bundle.ps1"
      - "scripts/build_azure_standalone_artifact.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/county-development-bundle.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "cockpit/**"
      - "deploy/county-development/**"
      - "drizzle/**"
      - "scripts/accept-county-development-runtime.cjs"
      - "scripts/build-county-development-bundle.ps1"
      - "scripts/build_azure_standalone_artifact.ps1"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: county-development-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Windows x64 offline bundle and owner-surface acceptance
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      OLLAMA_VERSION: v0.9.2
      PGVECTOR_VERSION: v0.8.1
      PLAYWRIGHT_VERSION: 1.55.0
      WILLIAMOS_COCKPIT_PROFILE: county-development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install application dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir cockpit install --frozen-lockfile

      - name: Build WilliamOS standalone application
        shell: pwsh
        run: pnpm run build
        env:
          CI: "true"

      - name: Build and test County Development Cockpit
        shell: pwsh
        run: |
          pnpm --dir cockpit native:test
          pnpm --dir cockpit tauri:build

      - name: Install portable PostgreSQL build source
        shell: pwsh
        run: |
          choco install postgresql16 --no-progress -y --params "'/Password:CountyBundleBuildOnly_73aM9q /Port:55432'"
          Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          $pgRoot = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $pgRoot) { throw 'PostgreSQL installation root was not found.' }
          "PGROOT=$pgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build pgvector into the portable PostgreSQL tree
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:PGVECTOR_VERSION https://github.com/pgvector/pgvector.git $env:RUNNER_TEMP\pgvector
          Push-Location $env:RUNNER_TEMP\pgvector
          try {
            nmake /F Makefile.win
            if ($LASTEXITCODE -ne 0) { throw "pgvector build failed: $LASTEXITCODE" }
            nmake /F Makefile.win install
            if ($LASTEXITCODE -ne 0) { throw "pgvector install failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path "$env:PGROOT\share\extension\vector.control")) {
            throw 'pgvector control file was not installed.'
          }

      - name: Download pinned official Ollama Windows runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ollamaRoot = "$env:RUNNER_TEMP\ollama"
          New-Item -ItemType Directory -Path $ollamaRoot -Force | Out-Null
          gh release download $env:OLLAMA_VERSION --repo ollama/ollama --pattern 'ollama-windows-amd64.zip' --dir $ollamaRoot
          Expand-Archive -LiteralPath "$ollamaRoot\ollama-windows-amd64.zip" -DestinationPath "$ollamaRoot\runtime" -Force
          if (-not (Test-Path "$ollamaRoot\runtime\ollama.exe")) { throw 'ollama.exe was not found.' }
          "OLLAMA_ROOT=$ollamaRoot\runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Pull the County local coding and embedding models
        shell: pwsh
        run: |
          $modelRoot = "$env:RUNNER_TEMP\ollama-models"
          New-Item -ItemType Directory -Path $modelRoot -Force | Out-Null
          $env:OLLAMA_HOST = '127.0.0.1:11435'
          $env:OLLAMA_MODELS = $modelRoot
          $ollama = "$env:OLLAMA_ROOT\ollama.exe"
          $process = Start-Process -FilePath $ollama -ArgumentList 'serve' -PassThru -WindowStyle Hidden
          try {
            $deadline = [DateTimeOffset]::UtcNow.AddSeconds(60)
            do {
              try { Invoke-RestMethod 'http://127.0.0.1:11435/api/tags' -TimeoutSec 5 | Out-Null; break }
              catch { Start-Sleep -Milliseconds 750 }
            } while ([DateTimeOffset]::UtcNow -lt $deadline)
            & $ollama pull qwen2.5-coder:1.5b
            if ($LASTEXITCODE -ne 0) { throw "Coding model pull failed: $LASTEXITCODE" }
            & $ollama pull snowflake-arctic-embed2
            if ($LASTEXITCODE -ne 0) { throw "Embedding model pull failed: $LASTEXITCODE" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          "MODEL_ROOT=$modelRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assemble source-pinned offline package
        shell: pwsh
        run: |
          $node = (Get-Command node.exe).Source
          $cockpit = Resolve-Path 'cockpit\src-tauri\target\release\williamos-cockpit.exe'
          $loader = Resolve-Path 'cockpit\src-tauri\target\release\WebView2Loader.dll'
          .\scripts\build-county-development-bundle.ps1 `
            -NodeExe $node `
            -PostgresRoot $env:PGROOT `
            -OllamaRoot $env:OLLAMA_ROOT `
            -CockpitExe $cockpit `
            -WebView2Loader $loader `
            -SourceSha '${{ github.sha }}' `
            -ModelRoot $env:MODEL_ROOT `
            -OutputRoot "$env:RUNNER_TEMP\county-output" |
            Tee-Object -FilePath "$env:RUNNER_TEMP\county-build-result.json"

      - name: Install the packaged loopback runtime
        shell: pwsh
        run: |
          $bundle = Get-ChildItem "$env:RUNNER_TEMP\county-output\WilliamOS-County-Development-*.zip" | Select-Object -First 1
          if (-not $bundle) { throw 'County application bundle was not created.' }
          $package = "$env:RUNNER_TEMP\county-smoke-package"
          Expand-Archive -LiteralPath $bundle.FullName -DestinationPath $package -Force
          $packageRoot = $package
          if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'manifest.json') -PathType Leaf)) {
            throw 'Extracted County package root does not contain manifest.json.'
          }

          $tfRoot = "$env:RUNNER_TEMP\terrafusion_os_1.0"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/bsvalues/terrafusion_os_1.0.git $tfRoot
          if ($LASTEXITCODE -ne 0) { throw "Source-pinned TerraFusion clone failed: $LASTEXITCODE" }
          foreach ($required in @('README.md', 'package.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $tfRoot $required) -PathType Leaf)) {
              throw "Sparse TerraFusion checkout is missing $required"
            }
          }
          $tfSha = (git -C $tfRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tfSha -notmatch '^[0-9a-f]{40}$') {
            throw 'The exact TerraFusion source revision could not be established.'
          }

          $manager = Join-Path $packageRoot 'deploy\county-development\Manage-WilliamOSCountyDevelopment.ps1'
          $smokeInstall = "$env:RUNNER_TEMP\county-installed"
          $smokeData = "$env:RUNNER_TEMP\county-data"
          $evidenceRoot = "$env:RUNNER_TEMP\county-acceptance"
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          & $manager -Action Install -InstallRoot $smokeInstall -DataRoot $smokeData `
            -OwnerEmail 'county.bundle@example.gov' -TerraFusionRoot $tfRoot `
            -DeploymentId 'ci-county-development' -ModelSource $env:MODEL_ROOT `
            -NonInteractive -SkipCockpit
          if ($LASTEXITCODE -ne 0) { throw "County install smoke failed: $LASTEXITCODE" }

          $status = & (Join-Path $smokeInstall 'deploy\county-development\Manage-WilliamOSCountyDevelopment.ps1') `
            -Action Status -InstallRoot $smokeInstall -DataRoot $smokeData | ConvertFrom-Json
          if (-not $status.health) { throw 'Installed WilliamOS health evidence is missing.' }
          if ($status.health.deployment.profile -ne 'county-development') { throw 'Wrong deployment profile.' }
          if (-not $status.health.deployment.valid) { throw 'County boundary is not valid.' }
          if (-not $status.health.deployment.localOnlyInference) { throw 'Local-only inference is not proven.' }
          if ($status.health.deployment.serviceOrigin -ne 'http://127.0.0.1:3200') { throw 'Service origin is not loopback.' }
          if ($status.health.checks.runtime.chatModel -ne 'qwen2.5-coder:1.5b') { throw 'Exact local chat model is not healthy.' }
          if ($status.health.checks.runtime.embeddingResolvedModel -ne 'snowflake-arctic-embed2:latest' -and
              $status.health.checks.runtime.embeddingResolvedModel -ne 'snowflake-arctic-embed2') {
            throw 'Exact local embedding model is not healthy.'
          }

          "COUNTY_SMOKE_INSTALL=$smokeInstall" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "COUNTY_SMOKE_DATA=$smokeData" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "COUNTY_SMOKE_TF=$tfRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "COUNTY_SMOKE_TF_SHA=$tfSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "COUNTY_ACCEPTANCE_EVIDENCE=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "COUNTY_ACCEPTANCE_BROWSER_PROFILE=$env:RUNNER_TEMP\county-browser-profile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the browser acceptance driver
        shell: pwsh
        run: |
          $driverRoot = "$env:RUNNER_TEMP\county-playwright"
          npm install --prefix $driverRoot --no-save --package-lock=false "playwright@$env:PLAYWRIGHT_VERSION"
          & "$driverRoot\node_modules\.bin\playwright.cmd" install chromium
          "NODE_PATH=$driverRoot\node_modules" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run installed County owner-surface acceptance
        shell: pwsh
        env:
          COUNTY_ACCEPTANCE_ORIGIN: http://127.0.0.1:3200
          COUNTY_ACCEPTANCE_EXPECTED_DEPLOYMENT_ID: ci-county-development
          COUNTY_ACCEPTANCE_OWNER_EMAIL: county.bundle@example.gov
          COUNTY_ACCEPTANCE_OWNER_PASSWORD: County-Bundle-Acceptance-2026!
        run: |
          $env:COUNTY_ACCEPTANCE_TERRAFUSION_ROOT = $env:COUNTY_SMOKE_TF
          $env:COUNTY_ACCEPTANCE_TERRAFUSION_SHA = $env:COUNTY_SMOKE_TF_SHA
          $env:COUNTY_ACCEPTANCE_EVIDENCE_ROOT = $env:COUNTY_ACCEPTANCE_EVIDENCE
          node scripts/accept-county-development-runtime.cjs

      - name: Exercise the installed County Cockpit relaunch path
        shell: pwsh
        run: |
          $manager = Join-Path $env:COUNTY_SMOKE_INSTALL 'deploy\county-development\Manage-WilliamOSCountyDevelopment.ps1'
          $cockpitPath = Join-Path $env:COUNTY_SMOKE_INSTALL 'cockpit\williamos-cockpit.exe'
          if (-not (Test-Path -LiteralPath $cockpitPath -PathType Leaf)) { throw 'Installed County Cockpit is missing.' }

          function Start-And-ObserveCountyCockpit {
            param([int]$Attempt)
            $before = @(Get-Process -Name 'williamos-cockpit' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
            & $manager -Action Launch -InstallRoot $env:COUNTY_SMOKE_INSTALL -DataRoot $env:COUNTY_SMOKE_DATA

            $deadline = [DateTimeOffset]::UtcNow.AddSeconds(45)
            $process = $null
            do {
              Start-Sleep -Milliseconds 750
              $process = Get-Process -Name 'williamos-cockpit' -ErrorAction SilentlyContinue |
                Where-Object { $before -notcontains $_.Id } |
                Sort-Object StartTime -Descending |
                Select-Object -First 1
              if ($process) {
                $process.Refresh()
                if ($process.HasExited) { throw "County Cockpit attempt $Attempt exited during startup with code $($process.ExitCode)." }
              }
            } while ((-not $process -or $process.MainWindowHandle -eq 0) -and [DateTimeOffset]::UtcNow -lt $deadline)

            if (-not $process -or $process.MainWindowHandle -eq 0) {
              throw "County Cockpit attempt $Attempt did not expose a native main window through the installed Launch lifecycle."
            }
            if ($process.MainWindowTitle -ne 'WilliamOS County Development') {
              throw "County Cockpit attempt $Attempt exposed the wrong native title: $($process.MainWindowTitle)"
            }
            $result = [ordered]@{
              attempt = $Attempt
              processId = $process.Id
              mainWindowObserved = $true
              mainWindowTitle = $process.MainWindowTitle
              processAlive = -not $process.HasExited
            }
            Stop-Process -Id $process.Id -Force
            Start-Sleep -Milliseconds 750
            return $result
          }

          $first = Start-And-ObserveCountyCockpit 1
          $second = Start-And-ObserveCountyCockpit 2
          $observation = [ordered]@{
            schema = 'williamos.county-development.cockpit-acceptance.v2'
            result = 'PASS'
            observedAt = [DateTimeOffset]::UtcNow.ToString('o')
            launchMode = 'installed-manager-after-owner-enrollment'
            configuredOrigin = 'http://127.0.0.1:3200'
            launches = @($first, $second)
          }
          $observation | ConvertTo-Json -Depth 8 | Set-Content `
            -LiteralPath (Join-Path $env:COUNTY_ACCEPTANCE_EVIDENCE 'cockpit-acceptance.json') -Encoding utf8

      - name: Remove the smoke installation
        if: always()
        shell: pwsh
        run: |
          $manager = if ($env:COUNTY_SMOKE_INSTALL) {
            Join-Path $env:COUNTY_SMOKE_INSTALL 'deploy\county-development\Manage-WilliamOSCountyDevelopment.ps1'
          } else { $null }
          if ($manager -and (Test-Path -LiteralPath $manager -PathType Leaf)) {
            & $manager -Action Uninstall -InstallRoot $env:COUNTY_SMOKE_INSTALL -DataRoot $env:COUNTY_SMOKE_DATA -PurgeData
          }

      - name: Upload County Development application bundle
        uses: actions/upload-artifact@v4
        with:
          name: WilliamOS-County-Development-${{ github.sha }}
          path: ${{ runner.temp }}\county-output\WilliamOS-County-Development-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload County Development model pack
        uses: actions/upload-artifact@v4
        with:
          name: WilliamOS-County-Models-${{ github.sha }}
          path: ${{ runner.temp }}\county-output\WilliamOS-County-Models-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload County Development acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WilliamOS-County-Development-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}\county-acceptance\**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload package build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WilliamOS-County-Development-build-evidence-${{ github.sha }}
          path: ${{ runner.temp }}\county-build-result.json
          if-no-files-found: warn
