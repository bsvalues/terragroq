# WilliamOS authority registry — host-based access policy.
#
# OWNED BY THIS REPOSITORY. Mounted read-only at /etc/williamos/pg_hba.conf by compose.yaml, which
# points `hba_file` here. The copy inside the `williamos_pgdata` volume is untouched and no longer
# consulted, so this policy cannot drift by someone editing a file inside a container, and the
# rollback is to stop using the compose file rather than to restore an edited one.
#
# WHAT IT REPLACES. The policy found in the volume on 2026-08-25 ended with:
#
#     host all all all scram-sha-256
#
# every database, every role, from anywhere. That line was harmless only for as long as the
# container's publish was broken. Publishing on 0.0.0.0:15432 with that line still present is
# exactly the "Postgres open to the LAN" the owner's decision forbids.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# ---------------------------------------------------------------------------------------------
# Container-local administration. The unix socket inside the container, reachable only through
# `docker exec`, which is a channel that already has root on ATLAS. This is what pg_isready and
# out-of-band read-only observation use.
#
# The postgres image's default `host ... 127.0.0.1/32 trust` lines are deliberately NOT carried
# over. That loopback is the container's, not the host's, and nothing needs it: leaving a `trust`
# method on a TCP address when the port is published is a class of mistake worth not having.
# ---------------------------------------------------------------------------------------------
local   all             all                                     trust
local   replication     all                                     trust

# ---------------------------------------------------------------------------------------------
# Approved WilliamOS fabric callers. Declared in fabric-callers.json; keep the two in step.
#
# Narrowed on all four axes at once: one database, one role, one host, password authentication.
# A caller that is on the list still cannot reach `postgres`, `template1`, or any other role.
#
#   hermes-node / HERMES — the control plane, the only node that evaluates authority.
# ---------------------------------------------------------------------------------------------
host    williamos       williamos       192.168.88.9/32         scram-sha-256

# ---------------------------------------------------------------------------------------------
# Default closed. Everything not named above is refused at the policy layer, in addition to being
# dropped at the packet layer by apply-network-policy.sh. Two layers, because either one alone is
# a single point of failure in front of the lab's only authority oracle.
#
# `reject` rather than omission on purpose: an omitted rule and an explicit refusal both deny, but
# only the explicit one says in the log that a policy decided.
# ---------------------------------------------------------------------------------------------
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
