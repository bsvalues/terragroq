name: williamos-hermes-agent

services:
  agent:
    build:
      context: ./source-lf
    image: williamos-hermes-agent:0.20.0-fa83af3
    profiles: ["manual"]
    networks:
      - inference
    depends_on:
      inference-proxy:
        condition: service_started
    volumes:
      - ${WILLIAMOS_AGENT_WORKSPACE:?set a unique per-run workspace}:/workspace
      - ./config.yaml:/opt/data/config.yaml:ro
      - ./run_agent.py:/opt/runner/run_agent.py:ro
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_API_TIMEOUT: "1800"
      HERMES_STREAM_READ_TIMEOUT: "1800"
      HERMES_WRITE_SAFE_ROOT: /workspace
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /opt/data:rw,nosuid,size=256m,mode=0755
      - /run:rw,exec,nosuid,size=64m,mode=0755
      - /tmp:rw,exec,nosuid,size=512m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 8g
    cpus: 4
    command: ["chat", "--help"]

  inference-proxy:
    image: williamos-hermes-agent:0.20.0-fa83af3
    profiles: ["manual"]
    entrypoint: ["python", "/opt/proxy/inference_proxy.py"]
    container_name: williamos-hermes-inference-proxy
    user: "10000:10000"
    networks:
      - inference
      - hermes-backend
    volumes:
      - ./inference_proxy.py:/opt/proxy/inference_proxy.py:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/models', timeout=10).read()"]
      interval: 10s
      timeout: 15s
      retries: 6

networks:
  inference:
    external: true
    name: williamos_free_agent_internal
  hermes-backend:
    external: true
    name: hermes_default
